apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mediflow-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: mediflow-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - mediflow-mediflow-app-backend:8000

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mediflow-app.fullname" . }}
  labels:
    {{- include "mediflow-app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: gce
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  defaultBackend:
    service:
      name: {{ include "mediflow-app.frontendName" . }}
      port:
        name: http
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.frontendHost is required when ingress is enabled" .Values.ingress.frontendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mediflow-app.frontendName" . }}
                port:
                  name: http
    - host: {{ required "ingress.apiHost is required when ingress is enabled" .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mediflow-app.backendName" . }}
                port:
                  name: http
{{- end }}

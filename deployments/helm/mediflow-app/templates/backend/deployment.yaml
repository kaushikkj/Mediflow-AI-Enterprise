apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediflow-app.backendName" . }}
  labels:
    {{- include "mediflow-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}

  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}

  selector:
    matchLabels:
      {{- include "mediflow-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend

  template:
    metadata:
      labels:
        {{- include "mediflow-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}

        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/common/secret.yaml") . | sha256sum }}
        {{- end }}

    spec:
      {{- with .Values.serviceAccount }}
      {{- if .name }}
      serviceAccountName: {{ .name }}
      {{- end }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "mediflow-app.configMapName" . }}

          # Keep using the existing Kubernetes Secret for now.
          # Secret Manager is mounted below only for validation.
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mediflow-app.secretName" . }}
                  key: jwtSecret

            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mediflow-app.secretName" . }}
                  key: minioAccessKey

            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mediflow-app.secretName" . }}
                  key: minioSecretKey

          # Google Secret Manager CSI mount
          volumeMounts:
            - name: mediflow-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}

      # Google Secret Manager CSI volume
      volumes:
        - name: mediflow-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mediflow-backend-secrets

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
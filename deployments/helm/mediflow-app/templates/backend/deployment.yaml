apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediflow-app.backendName" . }}
  labels:
    {{- include "mediflow-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}

  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}

  selector:
    matchLabels:
      {{- include "mediflow-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend

  template:
    metadata:
      labels:
        {{- include "mediflow-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}

    spec:
      {{- with .Values.serviceAccount }}
      {{- if .name }}
      serviceAccountName: {{ .name }}
      {{- end }}
      {{- end }}

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if .Values.gke.enabled }}
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--structured-logs"
            - "--port=5432"
            - "mediflow-ai-enterprise:asia-south1:mediflow-dev-postgres"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      {{- end }}

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "mediflow-app.configMapName" . }}

          {{- if .Values.gke.enabled }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mediflow-cloudsql-db
                  key: DATABASE_URL

          volumeMounts:
            - name: mediflow-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- end }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}

          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}

      {{- if .Values.gke.enabled }}
      volumes:
        - name: mediflow-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mediflow-backend-secrets
      {{- end }}

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
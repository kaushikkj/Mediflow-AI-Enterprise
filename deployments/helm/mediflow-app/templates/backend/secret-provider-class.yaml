apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mediflow-backend-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mediflow-ai-enterprise/secrets/mediflow-dev-jwt-secret/versions/latest"
        path: "jwt-secret"
      - resourceName: "projects/mediflow-ai-enterprise/secrets/mediflow-dev-minio-access-key/versions/latest"
        path: "minio-access-key"
      - resourceName: "projects/mediflow-ai-enterprise/secrets/mediflow-dev-minio-secret-key/versions/latest"
        path: "minio-secret-key"

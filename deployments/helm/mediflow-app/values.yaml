global:
  environment: dev

nameOverride: ""
fullnameOverride: ""
revisionHistoryLimit: 3
imagePullSecrets: []

# The current application images run as root. Harden the Dockerfiles to use
# non-root users before enabling runAsNonRoot in a later phase.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false

backend:
  replicaCount: 1
  image:
    repository: mediflow-one-v2-backend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 1
  image:
    repository: mediflow-one-v2-frontend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations: {}
  frontendHost: mediflow.local
  apiHost: api.mediflow.local
  tls: []

config:
  databaseUrl: postgresql+psycopg://mediflow:mediflow@postgres:5432/mediflow
  redisUrl: redis://redis:6379/0
  jwtExpireMinutes: "480"
  jwtAlgorithm: HS256
  jwtIssuer: mediflow-api
  jwtAudience: mediflow-web
  minioEndpoint: minio:9000
  minioBucket: medical-documents
  otelServiceName: mediflow-backend
  otelExporterOtlpEndpoint: http://alloy:4317
  otelExporterOtlpProtocol: grpc
  otelExporterOtlpInsecure: "true"
  otelTracesExporter: otlp

secret:
  existingSecret: ""
  jwtSecret: replace-me-before-deployment
  minioAccessKey: mediflow
  minioSecretKey: mediflow123

apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mediflow-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: ["/usr/bin/minio"]
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "mediflow"
            - name: MINIO_ROOT_PASSWORD
              value: "mediflow123"
          ports:
            - containerPort: 9000
            - containerPort: 9001

name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci_test.db
          JWT_SECRET: github-actions-ci-secret
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minio
          S3_SECRET_KEY: minio123
          S3_BUCKET: mediflow-documents
        run: pytest -q

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: |
          helm lint deployments/helm/mediflow-app \
            -f deployments/helm/mediflow-app/values-local.yaml

      - name: Render local manifests
        run: |
          helm template mediflow deployments/helm/mediflow-app \
            --namespace mediflow-dev \
            -f deployments/helm/mediflow-app/values-local.yaml \
            > /tmp/mediflow-local.yaml

          test -s /tmp/mediflow-local.yaml

      - name: Render GKE manifests
        run: |
          helm template mediflow deployments/helm/mediflow-app \
            --namespace mediflow-dev \
            -f deployments/helm/mediflow-app/values-gke-dev.yaml \
            --set backend.image.repository=example.invalid/mediflow/backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=example.invalid/mediflow/frontend \
            --set frontend.image.tag=${{ github.sha }} \
            > /tmp/mediflow-gke.yaml

          test -s /tmp/mediflow-gke.yaml

  compose:
    name: Container Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build backend and frontend images
        run: docker compose -f compose.yaml build backend frontend

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - helm
      - compose

    steps:
      - name: Confirm successful validation
        run: |
          echo "Frontend build passed."
          echo "Backend tests passed."
          echo "Helm validation passed."
          echo "Container validation passed."
